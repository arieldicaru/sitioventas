<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda de Electrónicos (POS)</title>
    <!-- Carga de Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Carga de la fuente Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Estilo base con la fuente Inter */
        body {
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }
        /* Estilos para un scrollbar más delgado */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a0aec0;
        }
        /* Estilo para la pestaña de categoría activa */
        .category-tab.active {
            background-color: #2563eb; /* bg-blue-600 */
            color: #ffffff; /* text-white */
        }
    </style>
</head>
<body class="bg-gray-100">

    <div class="flex flex-col md:flex-row h-screen" id="app">

        <!-- ===== SECCIÓN DE PRODUCTOS (IZQUIERDA) ===== -->
        <main class="flex-1 p-4 md:p-6 overflow-y-auto">
            <h1 class="text-3xl font-bold text-gray-800 mb-4">Tienda de Electrónicos</h1>
            
            <!-- Pestañas de Categorías -->
            <nav id="category-tabs" class="flex space-x-2 mb-4">
                <!-- Las categorías se insertarán aquí por JavaScript -->
            </nav>

            <!-- Barra de Búsqueda -->
            <div class="mb-4">
                <input type="text" id="search-bar" placeholder="Buscar por modelo o marca..." class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            
            <!-- Contenedor de la cuadrícula de productos -->
            <div id="product-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 md:gap-6">
                <!-- Los productos se insertarán aquí -->
            </div>
            <div id="no-results-message" class="hidden text-center text-gray-500 mt-10">
                No se encontraron productos.
            </div>
        </main>

        <!-- ===== SECCIÓN DEL CARRITO (DERECHA) ===== -->
        <aside class="w-full md:w-80 lg:w-96 bg-white shadow-xl flex flex-col h-1/2 md:h-screen">
            
            <!-- Encabezado del Carrito -->
            <div class="p-4 border-b border-gray-200">
                <h2 class="text-xl font-semibold text-gray-700">Pedido Actual</h2>
            </div>
            
            <!-- Lista de Items en el Carrito -->
            <div id="cart-items" class="flex-1 p-4 overflow-y-auto">
                <!-- Mensaje de carrito vacío -->
                <div id="cart-empty-message" class="flex items-center justify-center h-full">
                    <p class="text-gray-500 text-center">Tu carrito está vacío</p>
                </div>
                <!-- Los items del carrito se insertarán aquí -->
            </div>
            
            <!-- Resumen y Total -->
            <div class="p-4 border-t border-gray-200 bg-gray-50">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-gray-600">Subtotal:</span>
                    <span id="subtotal-amount" class="font-medium text-gray-800">$0.00</span>
                </div>
                <div class="flex justify-between items-center mb-4">
                    <span class="text-gray-600">IVA (16%):</span>
                    <span id="tax-amount" class="font-medium text-gray-800">$0.00</span>
                </div>
                <div class="flex justify-between items-center mb-4 border-t pt-4">
                    <span class="text-xl font-bold text-gray-900">Total:</span>
                    <span id="total-amount" class="text-xl font-bold text-blue-600">$0.00</span>
                </div>
                
                <!-- Botones de Acción -->
                <div class="flex space-x-2">
                    <button id="clear-cart-btn" class="w-1/2 bg-red-500 text-white p-3 rounded-lg font-bold hover:bg-red-600 transition-colors duration-200 disabled:opacity-50">
                        Vaciar
                    </button>
                    <button id="checkout-btn" class="w-full bg-blue-600 text-white p-3 rounded-lg font-bold text-lg hover:bg-blue-700 transition-colors duration-200 shadow-md disabled:opacity-50">
                        Procesar Pago
                    </button>
                </div>
            </div>
        </aside>

    </div>

    <!-- ===== MODAL DE ÉXITO (OCULTO POR DEFECTO) ===== -->
    <div id="success-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50 p-4">
        <div class="bg-white p-8 md:p-12 rounded-xl shadow-2xl text-center max-w-sm w-full">
            <svg class="w-20 h-20 text-green-500 mx-auto mb-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <h3 class="text-2xl font-bold text-gray-800 mb-4">¡Venta Completada!</h3>
            <p class="text-gray-600 mb-8">El pedido ha sido procesado exitosamente.</p>
            <button id="new-order-btn" class="w-full bg-blue-600 text-white p-3 rounded-lg font-semibold hover:bg-blue-700 transition-colors">
                Nuevo Pedido
            </button>
        </div>
    </div>

    <!-- ===== SCRIPT DE JAVASCRIPT ===== -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {

            // --- 1. DATOS DE EJEMPLO (ELECTRÓNICOS) ---
            const products = [
                { id: 1, name: 'Laptop Pro 15"', price: 1299.99, image: 'https://placehold.co/150x150/9CA3AF/FFF?text=Laptop+Pro', category: 'Laptops' },
                { id: 2, name: 'Smartphone Z10', price: 799.50, image: 'https://placehold.co/150x150/9CA3AF/FFF?text=Smartphone+Z10', category: 'Smartphones' },
                { id: 3, name: 'Auriculares Inalámbricos', price: 199.00, image: 'https://placehold.co/150x150/9CA3AF/FFF?text=Auriculares', category: 'Accesorios' },
                { id: 4, name: 'Laptop Ultraligera', price: 950.00, image: 'https://placehold.co/150x150/9CA3AF/FFF?text=Laptop+Ligera', category: 'Laptops' },
                { id: 5, name: 'Smartphone G-Max', price: 450.00, image: 'https://placehold.co/150x150/9CA3AF/FFF?text=Smartphone+GMax', category: 'Smartphones' },
                { id: 6, name: 'Teclado Mecánico RGB', price: 120.00, image: 'https://placehold.co/150x150/9CA3AF/FFF?text=Teclado+RGB', category: 'Accesorios' },
                { id: 7, name: 'Smartwatch V5', price: 249.99, image: 'https://placehold.co/150x150/9CA3AF/FFF?text=Smartwatch', category: 'Accesorios' },
                { id: 8, name: 'Mouse Ergonómico', price: 45.00, image: 'https://placehold.co/150x150/9CA3AF/FFF?text=Mouse', category: 'Accesorios' },
                { id: 9, name: 'Cargador USB-C 65W', price: 39.99, image: 'https://placehold.co/150x150/9CA3AF/FFF?text=Cargador', category: 'Accesorios' },
                { id: 10, name: 'Smartphone K2', price: 299.00, image: 'https://placehold.co/150x150/9CA3AF/FFF?text=Smartphone+K2', category: 'Smartphones' },
                { id: 11, name: 'Monitor Curvo 32"', price: 399.00, image: 'https://placehold.co/150x150/9CA3AF/FFF?text=Monitor+Curvo', category: 'Monitores' },
                { id: 12, name: 'Tablet Pro 11"', price: 650.00, image: 'https://placehold.co/150x150/9CA3AF/FFF?text=Tablet+Pro', category: 'Tablets' },
            ];

            const TAX_RATE = 0.16; // 16% de IVA
            
            // --- 2. ESTADO DE LA APLICACIÓN ---
            let cart = [];
            let activeCategory = 'Todos';
            let searchQuery = '';

            // --- 3. SELECTORES DEL DOM ---
            const productGrid = document.getElementById('product-grid');
            const cartItemsContainer = document.getElementById('cart-items');
            const cartEmptyMessage = document.getElementById('cart-empty-message');
            const subtotalAmountEl = document.getElementById('subtotal-amount');
            const taxAmountEl = document.getElementById('tax-amount');
            const totalAmountEl = document.getElementById('total-amount');
            const checkoutBtn = document.getElementById('checkout-btn');
            const successModal = document.getElementById('success-modal');
            const newOrderBtn = document.getElementById('new-order-btn');
            const categoryTabs = document.getElementById('category-tabs');
            const searchBar = document.getElementById('search-bar');
            const noResultsMessage = document.getElementById('no-results-message');
            const clearCartBtn = document.getElementById('clear-cart-btn');

            // --- 4. FUNCIONES PRINCIPALES ---

            /**
             * Renderiza las pestañas de categorías
             */
            function renderCategories() {
                // Obtener categorías únicas
                const categories = ['Todos', ...new Set(products.map(p => p.category))];
                categoryTabs.innerHTML = '';
                categories.forEach(category => {
                    const isActive = category === activeCategory;
                    const tab = document.createElement('button');
                    tab.textContent = category;
                    tab.dataset.category = category;
                    tab.className = `category-tab px-4 py-2 rounded-lg font-medium text-sm transition-colors ${isActive ? 'active' : 'bg-white text-gray-700 hover:bg-gray-200'}`;
                    categoryTabs.appendChild(tab);
                });
            }

            /**
             * Renderiza los productos en la cuadrícula, aplicando filtros
             */
            function renderProducts() {
                productGrid.innerHTML = '';
                
                // Aplicar filtros
                const filteredProducts = products
                    .filter(product => {
                        // Filtro de categoría
                        return activeCategory === 'Todos' || product.category === activeCategory;
                    })
                    .filter(product => {
                        // Filtro de búsqueda
                        return product.name.toLowerCase().includes(searchQuery.toLowerCase());
                    });
                
                if (filteredProducts.length === 0) {
                    noResultsMessage.classList.remove('hidden');
                } else {
                    noResultsMessage.classList.add('hidden');
                }

                filteredProducts.forEach(product => {
                    const productCard = `
                        <div class="bg-white rounded-lg shadow-md p-4 flex flex-col items-center cursor-pointer hover:shadow-lg hover:scale-105 transition-all duration-200" data-id="${product.id}">
                            <img src="${product.image}" alt="${product.name}" class="w-24 h-24 object-cover mb-3 rounded-md">
                            <h3 class="font-semibold text-gray-800 text-center text-sm mb-1">${product.name}</h3>
                            <span class="text-gray-600 font-medium">$${product.price.toFixed(2)}</span>
                        </div>
                    `;
                    productGrid.innerHTML += productCard;
                });
            }

            /**
             * Añade un producto al carrito o incrementa su cantidad
             */
            function addToCart(productId) {
                const product = products.find(p => p.id === productId);
                const cartItem = cart.find(item => item.id === productId);

                if (cartItem) {
                    cartItem.quantity++;
                } else {
                    cart.push({ ...product, quantity: 1 });
                }
                updateCartDisplay();
            }

            /**
             * Incrementa la cantidad de un item en el carrito
             */
            function increaseQuantity(productId) {
                const cartItem = cart.find(item => item.id === productId);
                if (cartItem) {
                    cartItem.quantity++;
                }
                updateCartDisplay();
            }

            /**
             * Decrementa la cantidad de un item en el carrito
             */
            function decreaseQuantity(productId) {
                const cartItem = cart.find(item => item.id === productId);
                if (cartItem) {
                    if (cartItem.quantity > 1) {
                        cartItem.quantity--;
                    } else {
                        // Si la cantidad es 1, eliminarlo
                        removeFromCart(productId);
                    }
                }
                updateCartDisplay();
            }

            /**
             * Elimina un producto del carrito
             */
            function removeFromCart(productId) {
                cart = cart.filter(item => item.id !== productId);
                updateCartDisplay();
            }

            /**
             * Limpia todo el carrito
             */
            function clearCart() {
                cart = [];
                updateCartDisplay();
            }
            
            /**
             * Actualiza el estado (activado/desactivado) de los botones del carrito
             */
            function updateCartButtonsState() {
                const isEmpty = cart.length === 0;
                checkoutBtn.disabled = isEmpty;
                clearCartBtn.disabled = isEmpty;
            }

            /**
             * Actualiza la UI del carrito (lista y totales)
             */
            function updateCartDisplay() {
                // Mostrar/ocultar mensaje de carrito vacío
                if (cart.length === 0) {
                    cartEmptyMessage.classList.remove('hidden');
                    cartItemsContainer.innerHTML = ''; // Limpiar, pero dejar el mensaje
                } else {
                    cartEmptyMessage.classList.add('hidden');
                    cartItemsContainer.innerHTML = ''; // Limpiar para añadir items
                }

                let subtotal = 0;
                
                // Renderizar cada item en el carrito
                cart.forEach(item => {
                    const itemTotal = item.price * item.quantity;
                    subtotal += itemTotal;
                    
                    const cartItemEl = `
                        <div class="flex items-center mb-3">
                            <div class="flex-1">
                                <h4 class="font-medium text-sm text-gray-800">${item.name}</h4>
                                <p class="text-xs text-gray-500">$${item.price.toFixed(2)}</p>
                            </div>
                            <!-- Controles de Cantidad -->
                            <div class="flex items-center space-x-2">
                                <button class="qty-btn qty-decrease bg-gray-200 text-gray-700 rounded-full w-6 h-6 flex items-center justify-center hover:bg-gray-300" data-id="${item.id}">-</button>
                                <span class="font-medium text-sm w-5 text-center">${item.quantity}</span>
                                <button class="qty-btn qty-increase bg-gray-200 text-gray-700 rounded-full w-6 h-6 flex items-center justify-center hover:bg-gray-300" data-id="${item.id}">+</button>
                            </div>
                            <span class="font-semibold text-gray-700 w-20 text-right">$${itemTotal.toFixed(2)}</span>
                            <!-- Botón para eliminar item -->
                            <button class="remove-item-btn ml-2 text-red-500 hover:text-red-700" data-id="${item.id}">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                            </button>
                        </div>
                    `;
                    cartItemsContainer.innerHTML += cartItemEl;
                });

                // Calcular y mostrar totales
                const tax = subtotal * TAX_RATE;
                const total = subtotal + tax;

                subtotalAmountEl.textContent = `$${subtotal.toFixed(2)}`;
                taxAmountEl.textContent = `$${tax.toFixed(2)}`;
                totalAmountEl.textContent = `$${total.toFixed(2)}`;

                // Actualizar estado de botones
                updateCartButtonsState();
            }

            /**
             * Procesa el pago (simulación)
             */
            function handleCheckout() {
                if (cart.length === 0) return;
                successModal.classList.remove('hidden');
            }

            /**
             * Cierra el modal y resetea el carrito
             */
            function handleNewOrder() {
                clearCart();
                successModal.classList.add('hidden');
            }

            // --- 5. EVENT LISTENERS ---

            // Clic en un producto de la cuadrícula
            productGrid.addEventListener('click', (e) => {
                const card = e.target.closest('.cursor-pointer');
                if (card) {
                    const productId = parseInt(card.dataset.id);
                    addToCart(productId);
                }
            });

            // Clics en los botones del carrito (aumento, decremento, eliminar)
            cartItemsContainer.addEventListener('click', (e) => {
                const target = e.target;
                const productId = parseInt(target.dataset.id);

                if (target.classList.contains('qty-increase')) {
                    increaseQuantity(productId);
                } else if (target.classList.contains('qty-decrease')) {
                    decreaseQuantity(productId);
                } else if (target.closest('.remove-item-btn')) {
                    // Usamos closest para el SVG dentro del botón
                    const removeBtn = target.closest('.remove-item-btn');
                    removeFromCart(parseInt(removeBtn.dataset.id));
                }
            });

            // Clic en el botón "Vaciar Pedido"
            clearCartBtn.addEventListener('click', clearCart);

            // Clic en el botón de "Procesar Pago"
            checkoutBtn.addEventListener('click', handleCheckout);

            // Clic en el botón de "Nuevo Pedido" en el modal
            newOrderBtn.addEventListener('click', handleNewOrder);

            // Clic en las pestañas de categoría
            categoryTabs.addEventListener('click', (e) => {
                if (e.target.classList.contains('category-tab')) {
                    activeCategory = e.target.dataset.category;
                    renderCategories(); // Re-renderizar para actualizar el estado "active"
                    renderProducts();
                }
            });

            // Escribir en la barra de búsqueda
            searchBar.addEventListener('input', (e) => {
                searchQuery = e.target.value;
                renderProducts();
            });
            
            // --- 6. INICIALIZACIÓN ---
            renderCategories();
            renderProducts();
            updateCartDisplay();
        });
    </script>
</body>
</html>
